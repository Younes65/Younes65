<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ibrahim Younes · 3D</title>
  <meta name="description" content="Interactive 3D profile of Ibrahim Younes, Senior Software Engineer." />
  <style>
    :root {
      --bg: #05070d;
      --ink: #e8f1ff;
      --muted: #8aa0bf;
      --accent: #36bcf7;
      --accent-2: #a46bff;
      --card: rgba(12, 18, 32, 0.72);
      --line: rgba(120, 170, 255, 0.18);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
      font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    canvas { display: block; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }

    .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 28px 32px; }
    .hud a, .hud button { pointer-events: auto; }
    .brand h1 { margin: 0; font-size: clamp(26px, 4vw, 44px); letter-spacing: -0.02em; font-weight: 700; }
    .brand h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: clamp(12px, 1.4vw, 15px); }

    .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .hint kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--ink); }
    .links { display: flex; gap: 10px; flex-wrap: wrap; }
    .links a { color: var(--ink); text-decoration: none; font-size: 13px; padding: 9px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); backdrop-filter: blur(8px);
      transition: border-color .2s, transform .2s; }
    .links a:hover { border-color: var(--accent); transform: translateY(-2px); }

    .card { position: fixed; pointer-events: none; min-width: 200px; max-width: 260px; padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--card); backdrop-filter: blur(10px);
      opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; }
    .card.show { opacity: 1; transform: translateY(0); }
    .card b { display: block; font-size: 14px; margin-bottom: 4px; }
    .card small { color: var(--muted); font-size: 12px; line-height: 1.5; }

    @media (max-width: 600px) { .hud { padding: 18px 16px; } .hint { display: none; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    <header class="brand">
      <h1>Ibrahim <span>Younes</span></h1>
      <p>Senior Software Engineer · Mobile &amp; Front-End Architecture</p>
    </header>
    <footer class="bottom">
      <div class="hint">
        <kbd>drag</kbd> orbit &nbsp; <kbd>scroll</kbd> zoom<br />
        <kbd>hover</kbd> a planet &nbsp; <kbd>click</kbd> the core to shatter it
      </div>
      <nav class="links">
        <a href="https://www.ibrahimyounes.online/" target="_blank" rel="noopener">🌐 Website</a>
        <a href="https://www.linkedin.com/in/ibrahim-younes-9963b8194/" target="_blank" rel="noopener">in LinkedIn</a>
        <a href="mailto:younesibrahim198@gmail.com">✉ Email</a>
        <a href="https://wa.me/971552852636" target="_blank" rel="noopener">☎ WhatsApp</a>
      </nav>
    </footer>
  </div>
  <div class="card" id="card"><b></b><small></small></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const SKILLS = [
      { name: "Flutter",  color: 0x47c5fb, ring: 0, note: "Cross-platform mobile apps with clean, scalable architecture." },
      { name: "Dart",     color: 0x00b4ab, ring: 0, note: "Typed, null-safe code powering every Flutter build." },
      { name: "Kotlin",   color: 0xa97bff, ring: 0, note: "Modern native Android with coroutines and Jetpack." },
      { name: "Java",     color: 0xf89820, ring: 0, note: "OOP foundations and native Android experience." },
      { name: "React",    color: 0x61dafb, ring: 1, note: "Component-driven, high-performance web front-ends." },
      { name: "Redux",    color: 0x764abc, ring: 1, note: "Predictable state for complex user interfaces." },
      { name: "JavaScript", color: 0xf7df1e, ring: 1, note: "The language of the web, from UI to Node." },
      { name: "Node.js",  color: 0x68a063, ring: 1, note: "APIs and tooling on the server side." },
      { name: "Firebase", color: 0xffca28, ring: 2, note: "Auth, Firestore, push and serverless back-ends." },
      { name: "SQL",      color: 0xcc2927, ring: 2, note: "Relational data modelling and queries." },
      { name: "Git",      color: 0xf05032, ring: 2, note: "Branching workflows, reviews and CI/CD." },
      { name: "SOLID",    color: 0x36bcf7, ring: 2, note: "Clean Architecture, OOP and maintainable code." },
    ];
    const RINGS = [
      { radius: 3.4, speed: 0.22, tilt: 0.25 },
      { radius: 5.0, speed: -0.15, tilt: -0.4 },
      { radius: 6.6, speed: 0.1, tilt: 0.6 },
    ];

    // ---------- renderer / scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070d, 0.028);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2.6, 12.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 6;
    controls.maxDistance = 22;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    scene.add(new THREE.AmbientLight(0x6080ff, 0.35));
    const keyLight = new THREE.PointLight(0x36bcf7, 60, 40);
    keyLight.position.set(6, 6, 6);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0xa46bff, 50, 40);
    rimLight.position.set(-6, -3, -5);
    scene.add(rimLight);

    // ---------- starfield ----------
    const STAR_COUNT = 2500;
    const starPos = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
      const r = 30 + Math.random() * 60;
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2 * Math.random() - 1);
      starPos.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)], i * 3);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x9fc3ff, size: 0.12, sizeAttenuation: true }));
    scene.add(stars);

    // ---------- core: morphing icosahedron + wireframe shell ----------
    const core = new THREE.Group();
    scene.add(core);

    const coreGeo = new THREE.IcosahedronGeometry(1.5, 24);
    const basePositions = coreGeo.attributes.position.array.slice();
    const coreMat = new THREE.MeshStandardMaterial({
      color: 0x2a4a9a, emissive: 0x0b1d5c, emissiveIntensity: 0.6, metalness: 0.55, roughness: 0.3, flatShading: true,
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    core.add(coreMesh);

    const shell = new THREE.LineSegments(
      new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(2.1, 1)),
      new THREE.LineBasicMaterial({ color: 0x36bcf7, transparent: true, opacity: 0.35 })
    );
    core.add(shell);

    // "IY" monogram floating in the core
    function makeLabelTexture(text, { size = 128, color = "#e8f1ff", bold = true, glow = "#36bcf7" } = {}) {
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");
      ctx.font = `${bold ? 700 : 500} ${size}px "Fira Code", monospace`;
      const w = Math.ceil(ctx.measureText(text).width) + size;
      c.width = w; c.height = size * 1.6;
      ctx.font = `${bold ? 700 : 500} ${size}px "Fira Code", monospace`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.shadowColor = glow; ctx.shadowBlur = size * 0.35;
      ctx.fillStyle = color;
      ctx.fillText(text, w / 2, c.height / 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return { tex, aspect: w / c.height };
    }
    const mono = makeLabelTexture("IY", { size: 160 });
    const monoSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: mono.tex, transparent: true, depthTest: false }));
    monoSprite.scale.set(1.6 * mono.aspect, 1.6, 1);
    monoSprite.renderOrder = 10;
    core.add(monoSprite);

    // shatter particles (sampled from core vertices)
    const SHARDS = 1400;
    const shardPos = new Float32Array(SHARDS * 3);
    const shardHome = new Float32Array(SHARDS * 3);
    const shardVel = new Float32Array(SHARDS * 3);
    for (let i = 0; i < SHARDS; i++) {
      const v = new THREE.Vector3().randomDirection().multiplyScalar(1.5);
      shardHome.set([v.x, v.y, v.z], i * 3);
      shardPos.set([v.x, v.y, v.z], i * 3);
    }
    const shardGeo = new THREE.BufferGeometry();
    shardGeo.setAttribute("position", new THREE.BufferAttribute(shardPos, 3));
    const shardMat = new THREE.PointsMaterial({ color: 0x7fd8ff, size: 0.07, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false });
    const shards = new THREE.Points(shardGeo, shardMat);
    core.add(shards);
    let shatter = 0; // 0 = whole, rises to 1 on click then eases back

    // ---------- orbit rings + skill planets ----------
    const ringGroups = RINGS.map((r) => {
      const g = new THREE.Group();
      g.rotation.x = r.tilt;
      g.rotation.z = r.tilt * 0.5;
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r.radius, 0.008, 8, 200),
        new THREE.MeshBasicMaterial({ color: 0x5b7cff, transparent: true, opacity: 0.35 })
      );
      ring.rotation.x = Math.PI / 2;
      g.add(ring);
      scene.add(g);
      return g;
    });

    const planets = [];
    const perRing = RINGS.map((_, i) => SKILLS.filter((s) => s.ring === i).length);
    const seen = RINGS.map(() => 0);
    for (const s of SKILLS) {
      const idx = seen[s.ring]++;
      const angle = (idx / perRing[s.ring]) * Math.PI * 2;
      const pivot = new THREE.Group();
      pivot.rotation.y = angle;
      ringGroups[s.ring].add(pivot);

      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.34, 32, 32),
        new THREE.MeshStandardMaterial({ color: s.color, emissive: s.color, emissiveIntensity: 0.45, metalness: 0.3, roughness: 0.35 })
      );
      mesh.position.x = RINGS[s.ring].radius;
      mesh.userData = s;
      pivot.add(mesh);

      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 24, 24),
        new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      mesh.add(halo);

      const lab = makeLabelTexture(s.name, { size: 56, bold: false, glow: "#" + s.color.toString(16).padStart(6, "0") });
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: lab.tex, transparent: true, depthWrite: false }));
      sprite.scale.set(0.42 * lab.aspect, 0.42, 1);
      sprite.position.y = 0.72;
      mesh.add(sprite);

      planets.push({ mesh, halo, pivot, ring: s.ring, hover: 0 });
    }

    // ---------- interaction ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(-10, -10);
    const pointerPx = { x: 0, y: 0 };
    const card = document.getElementById("card");
    let hovered = null;

    renderer.domElement.addEventListener("pointermove", (e) => {
      pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      pointerPx.x = e.clientX; pointerPx.y = e.clientY;
    });
    renderer.domElement.addEventListener("pointerleave", () => pointer.set(-10, -10));

    let downAt = 0;
    renderer.domElement.addEventListener("pointerdown", () => { downAt = performance.now(); });
    renderer.domElement.addEventListener("pointerup", () => {
      if (performance.now() - downAt > 250) return; // it was a drag, not a click
      raycaster.setFromCamera(pointer, camera);
      if (raycaster.intersectObject(coreMesh).length) {
        shatter = 1;
        for (let i = 0; i < SHARDS; i++) {
          const v = new THREE.Vector3().fromArray(shardHome, i * 3).normalize().multiplyScalar(0.08 + Math.random() * 0.18);
          shardVel.set([v.x, v.y, v.z], i * 3);
        }
      } else if (hovered) {
        hovered.pulse = 1;
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- animation ----------
    const clock = new THREE.Clock();
    const tmp = new THREE.Vector3();
    const planetMeshes = planets.map((p) => p.mesh);

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // morph core surface with layered sine noise
      const pos = coreGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = basePositions[i * 3], y = basePositions[i * 3 + 1], z = basePositions[i * 3 + 2];
        const n = Math.sin(x * 2.2 + t * 1.3) * Math.cos(y * 2.0 + t * 1.1) * Math.sin(z * 2.4 + t * 0.9);
        const k = 1 + n * 0.12;
        pos.setXYZ(i, x * k, y * k, z * k);
      }
      pos.needsUpdate = true;
      coreGeo.computeVertexNormals();

      core.rotation.y += dt * 0.25;
      shell.rotation.x -= dt * 0.15;
      shell.rotation.y += dt * 0.1;
      core.position.y = Math.sin(t * 0.8) * 0.15;

      // shatter / reform
      if (shatter > 0) {
        shatter = Math.max(0, shatter - dt * 0.45);
        const sp = shardGeo.attributes.position.array;
        const explode = shatter > 0.55;
        for (let i = 0; i < SHARDS * 3; i++) {
          if (explode) { sp[i] += shardVel[i]; shardVel[i] *= 0.96; }
          else sp[i] += (shardHome[i] - sp[i]) * 0.08;
        }
        shardGeo.attributes.position.needsUpdate = true;
        const vis = Math.min(1, shatter * 3);
        shardMat.opacity = vis;
        coreMesh.scale.setScalar(1 - vis * 0.95);
        monoSprite.material.opacity = 1 - vis;
      } else {
        shardMat.opacity = 0;
        coreMesh.scale.setScalar(1);
        monoSprite.material.opacity = 1;
      }

      // rings spin
      ringGroups.forEach((g, i) => { g.rotation.y += dt * RINGS[i].speed; });

      // hover detection
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(planetMeshes, false)[0];
      const next = hit ? planets.find((p) => p.mesh === hit.object) : null;
      if (next !== hovered) {
        hovered = next;
        if (hovered) {
          card.querySelector("b").textContent = hovered.mesh.userData.name;
          card.querySelector("small").textContent = hovered.mesh.userData.note;
        }
        card.classList.toggle("show", !!hovered);
        controls.autoRotate = !hovered;
        renderer.domElement.style.cursor = hovered ? "pointer" : "";
      }
      if (hovered) {
        card.style.left = Math.min(pointerPx.x + 18, window.innerWidth - 280) + "px";
        card.style.top = pointerPx.y + 18 + "px";
      }

      for (const p of planets) {
        p.hover += ((p === hovered ? 1 : 0) - p.hover) * 0.15;
        p.pulse = Math.max(0, (p.pulse || 0) - dt * 1.5);
        const s = 1 + p.hover * 0.45 + Math.sin(p.pulse * Math.PI) * 0.6;
        p.mesh.scale.setScalar(s);
        p.mesh.rotation.y += dt;
        p.halo.material.opacity = 0.12 + p.hover * 0.25;
        p.mesh.material.emissiveIntensity = 0.45 + p.hover * 0.8;
      }

      // subtle parallax on stars
      stars.rotation.y = t * 0.01;
      tmp.set(pointer.x * 0.6, pointer.y * 0.4, 0);
      keyLight.position.x = 6 + tmp.x * 4;
      keyLight.position.y = 6 + tmp.y * 4;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
